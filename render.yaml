# burningbush-api reuses the SHARED Kingdom Builders Postgres (kb-playbooks-db) — no new database.
# Data is schema-isolated: USERS_SCHEMA=kb (shared identity), DATA_SCHEMA=burningbush (this product).
# Provisioned via the Render API; env vars (incl. DATABASE_URL from kb-playbooks-db) set on the service.
services:
  - type: web
    name: burningbush-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL      # internal connection string of kb-playbooks-db (shared)
        sync: false
      - key: USERS_SCHEMA
        value: kb
      - key: DATA_SCHEMA
        value: burningbush
      - key: PRODUCT
        value: burningbush
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGIN
        value: https://kingdombuilders.ai
      - key: APP_URL
        value: https://kingdombuilders.ai/burningbush
      - key: BIBLE_API_KEY     # api.bible key; without it /api/bible returns 503 and the app stays on KJV
        sync: false
      - key: BIBLE_NLT_ID
        value: d6e14a625393b4da-01
      # - key: SENDGRID_API_KEY  (optional: enables password-reset emails)
      # - key: MAIL_FROM         (verified sender)
